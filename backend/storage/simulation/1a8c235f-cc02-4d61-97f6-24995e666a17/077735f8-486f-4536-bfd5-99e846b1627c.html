<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Law of Motion Simulation</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
        }
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .learn-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        .slider {
            width: 200px;
        }
        .button {
            background-color: #8b5cf6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #6c4ab7;
        }
        .canvas {
            border: 1px solid #06b6d4;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <h2>Control Panel</h2>
        <label for="mass-slider">Mass (kg):</label>
        <input type="range" id="mass-slider" class="slider" min="1" max="100" value="10">
        <span id="mass-value">10 kg</span>
        <br>
        <label for="force-slider">Force (N):</label>
        <input type="range" id="force-slider" class="slider" min="1" max="100" value="10">
        <span id="force-value">10 N</span>
        <br>
        <button class="button" id="reset-button">Reset</button>
    </div>
    <div class="learn-box">
        <h2>Learn</h2>
        <p>Newton's law of motion states that the force applied to an object is equal to its mass times its acceleration.</p>
        <p>Use the sliders to adjust the mass and force, and observe how the object moves.</p>
    </div>
    <canvas id="canvas" class="canvas" width="800" height="600"></canvas>
    <script>
        // Get the canvas element
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Set the canvas dimensions
        canvas.width = 800;
        canvas.height = 600;

        // Define the object properties
        let mass = 10;
        let force = 10;
        let acceleration = 0;
        let velocity = 0;
        let position = 0;

        // Define the object's initial position and velocity
        let objectX = canvas.width / 2;
        let objectY = canvas.height / 2;

        // Define the object's radius
        const objectRadius = 20;

        // Define the time step
        const dt = 0.01;

        // Define the gravity
        const gravity = 0;

        // Update the object's position and velocity
        function update() {
            // Calculate the acceleration
            acceleration = force / mass;

            // Update the velocity
            velocity += acceleration * dt;

            // Update the position
            position += velocity * dt;

            // Update the object's position
            objectX = position + canvas.width / 2;

            // Check for collision with the edge of the canvas
            if (objectX + objectRadius > canvas.width || objectX - objectRadius < 0) {
                velocity = -velocity;
            }
        }

        // Draw the object
        function draw() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw the object
            ctx.beginPath();
            ctx.arc(objectX, objectY, objectRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#8b5cf6';
            ctx.fill();

            // Draw the force vector
            ctx.beginPath();
            ctx.moveTo(objectX, objectY);
            ctx.lineTo(objectX + force * 10, objectY);
            ctx.strokeStyle = '#06b6d4';
            ctx.stroke();

            // Draw the mass label
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Mass: ' + mass + ' kg', 10, 10);

            // Draw the force label
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Force: ' + force + ' N', 10, 40);

            // Draw the acceleration label
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Acceleration: ' + acceleration.toFixed(2) + ' m/s^2', 10, 70);

            // Draw the velocity label
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Velocity: ' + velocity.toFixed(2) + ' m/s', 10, 100);
        }

        // Main loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start the simulation
        loop();

        // Add event listeners to the sliders
        document.getElementById('mass-slider').addEventListener('input', function() {
            mass = parseInt(this.value);
            document.getElementById('mass-value').innerHTML = mass + ' kg';
        });

        document.getElementById('force-slider').addEventListener('input', function() {
            force = parseInt(this.value);
            document.getElementById('force-value').innerHTML = force + ' N';
        });

        // Add event listener to the reset button
        document.getElementById('reset-button').addEventListener('click', function() {
            mass = 10;
            force = 10;
            acceleration = 0;
            velocity = 0;
            position = 0;
            objectX = canvas.width / 2;
            objectY = canvas.height / 2;
            document.getElementById('mass-slider').value = 10;
            document.getElementById('force-slider').value = 10;
            document.getElementById('mass-value').innerHTML = '10 kg';
            document.getElementById('force-value').innerHTML = '10 N';
        });
    </script>
</body>
</html>
